<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page & Dashboard Pengaturan</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        button.btn-save { background-color: #28a745; }
        button.btn-save:hover { background-color: #218838; }
        button.btn-logout { background-color: #dc3545; margin-top: 20px; }
        button.btn-logout:hover { background-color: #c82333; }
        .pesan { margin-top: 15px; padding: 10px; display: none; border-radius: 4px; font-weight: bold; text-align: center; }
        .sukses { background-color: #d4edda; color: #155724; }
        .gagal { background-color: #f8d7da; color: #721c24; }
        .info-box { background-color: #e2e3e5; padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        #halamanDashboard { display: none; }
    </style>
</head>
<body>

<div class="container">

    <!-- TAMPILAN 1: LANDING PAGE & LOGIN -->
    <div id="halamanLogin">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1>Selamat Datang</h1>
            <p>Silakan login untuk masuk ke menu pengaturan akun.</p>
        </div>
        
        <h2>Form Login</h2>
        <form id="formLogin">
            <div class="form-group">
                <label for="loginUser">Username</label>
                <input type="text" id="loginUser" placeholder="Masukkan username (ex: admin)" required>
            </div>
            <div class="form-group">
                <label for="loginPass">Password</label>
                <input type="password" id="loginPass" placeholder="Masukkan password (ex: admin123)" required>
            </div>
            <button type="submit">Masuk Sistem</button>
        </form>
    </div>

    <!-- TAMPILAN 2: DASHBOARD (SETELAH BERHASIL LOGIN) -->
    <div id="halamanDashboard">
        <div class="info-box">
            <h3>Selamat Datang, <span id="namaUser"></span>!</h3>
            <p>Role Anda saat ini: <strong style="color: #007bff;"><span id="roleUser"></span></strong></p>
        </div>

        <h2>Pengaturan: Tambah Akun Baru</h2>
        <form id="formTambahAkun">
            <div class="form-group">
                <label for="newUsername">Username Baru</label>
                <input type="text" id="newUsername" placeholder="Contoh: editor_budi" required>
            </div>
            <div class="form-group">
                <label for="newPassword">Password Kredensial</label>
                <input type="password" id="newPassword" placeholder="Buat password unik" required>
            </div>
            <div class="form-group">
                <label for="newRole">Role Akun</label>
                <select id="newRole">
                    <option value="Admin">Admin</option>
                    <option value="Editor">Editor</option>
                    <option value="Viewer">Viewer</option>
                </select>
            </div>
            <button type="submit" class="btn-save">Daftarkan Akun Baru</button>
        </form>

        <button onclick="logout()" class="btn-logout">Keluar Aplikasi</button>
    </div>

    <!-- NOTIFIKASI SYSTEM -->
    <div id="kotakPesan" class="pesan"></div>
</div>

<script>
    // =========================================================================
    // PASTE URL WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI
    // =========================================================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwz6VuFA3o47SyImuCJv-Jczjk2v3xrfUeS20xYsEUzMgvriY-37tMgfGrXPSJHlfqq/exec";
    
    const kotakPesan = document.getElementById('kotakPesan');

    function tampilPesan(teks, tipe) {
        kotakPesan.style.display = 'block';
        kotakPesan.className = 'pesan ' + (tipe === 'sukses' ? 'sukses' : 'gagal');
        kotakPesan.innerText = teks;
    }

    // PROSES LOGIN (Memakai metode GET untuk menghindari CORS issue)
    document.getElementById('formLogin').addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (WEB_APP_URL.includes("https://script.google.com/macros/s/AKfycbwz6VuFA3o47SyImuCJv-Jczjk2v3xrfUeS20xYsEUzMgvriY-37tMgfGrXPSJHlfqq/exec")) {
            return alert("PENTING: Ganti nilai WEB_APP_URL di index.html dengan URL Web App Anda!");
        }

        tampilPesan('Sedang memverifikasi...', 'sukses');

        const u = document.getElementById('loginUser').value;
        const p = document.getElementById('loginPass').value;

        // Tembak URL dengan query string agar terbaca oleh doGet()
        const urlPenuh = `${WEB_APP_URL}?action=cekLogin&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`;

        fetch(urlPenuh)
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                tampilPesan('Login Berhasil!', 'sukses');
                
                // Switch Halaman & Set Profil
                document.getElementById('halamanLogin').style.display = 'none';
                document.getElementById('halamanDashboard').style.display = 'block';
                document.getElementById('namaUser').innerText = data.username;
                document.getElementById('roleUser').innerText = data.role;
                
                document.getElementById('formLogin').reset();
                setTimeout(() => { kotakPesan.style.display = 'none'; }, 2000);
            } else {
                tampilPesan(data.message, 'gagal');
            }
        })
        .catch(err => {
            tampilPesan('Gagal terhubung! Periksa kembali URL Web App atau koneksi Anda.', 'gagal');
        });
    });

    // PROSES TAMBAH AKUN DI DASHBOARD
    document.getElementById('formTambahAkun').addEventListener('submit', function(e) {
        e.preventDefault();
        tampilPesan('Mendaftarkan akun ke Firebase...', 'sukses');

        const payload = {
            action: "tambahAkun",
            username: document.getElementById('newUsername').value,
            password: document.getElementById('newPassword').value,
            role: document.getElementById('newRole').value
        };

        // Post data akun baru menggunakan no-cors karena skema penyimpanan satu arah
        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload)
        })
        .then(() => {
            tampilPesan('Akun baru berhasil dikirim dan diproses!', 'sukses');
            document.getElementById('formTambahAkun').reset();
            setTimeout(() => { kotakPesan.style.display = 'none'; }, 3000);
        })
        .catch(err => tampilPesan('Terjadi gangguan saat menyimpan data.', 'gagal'));
    });

    // PROSES LOGOUT
    function logout() {
        document.getElementById('halamanDashboard').style.display = 'none';
        document.getElementById('halamanLogin').style.display = 'block';
        kotakPesan.style.display = 'none';
    }
</script>

</body>
</html>
